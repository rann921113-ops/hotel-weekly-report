function renderWeek(idx){
  const w=WEEKS_DATA[parseInt(idx)];
  if(!w)return;
  document.getElementById('metaBar').innerHTML=
    `<div class="meta-item">📅 <strong>수집 기간</strong> ${w.range}</div>
     <div class="meta-item">🗓️ <strong>발행일</strong> ${w.publishDate}</div>
     <div class="meta-item">🔍 <strong>OTA 기준</strong> ${w.checkinDate} 체크인 1박</div>`;
  document.getElementById('priceSubtitle').textContent=
    `${w.checkinDate} 체크인 1박 기준`;

  let newsHtml='';
  w.newsSections.forEach(g=>{
    newsHtml+=`<div class="news-group-header">${g.groupLabel}</div>`;
    const isEventGroup = g.groupLabel.includes('호텔 이벤트');
    if(isEventGroup){
      newsHtml+=`<div class="event-card-grid">`;
      g.items.forEach(item=>{
        const srcParts=item.source.split(' · ');
        const publisher=srcParts[0]||item.source;
        const pubDate=srcParts[1]||'';
        newsHtml+=`<div class="event-card">
          <div class="event-card-headline">${item.url?`<a href="${item.url}" target="_blank" rel="noopener">${item.headline}</a>`:item.headline}</div>
          <div class="event-card-meta"><span class="event-card-publisher">${publisher}</span>${pubDate?` <span class="event-card-date">· ${pubDate}</span>`:''}</div>
          <div class="event-card-summary">${item.summary}</div>
        </div>`;
      });
      newsHtml+=`</div>`;
    } else {
      g.items.forEach(item=>{
        newsHtml+=`
          <div class="news-item">
            <div class="news-emoji">${item.emoji}</div>
            <div>
              <div class="news-cat">${item.cat}</div>
              <div class="news-headline">${item.url?`<a href="${item.url}" target="_blank" rel="noopener">${item.headline}</a>`:item.headline}</div>
              <div class="news-source">📰 ${item.source}</div>
              <div class="news-summary">${item.summary}</div>
            </div>
          </div>`;
      });
    }
  });
  document.getElementById('newsSection').innerHTML=newsHtml;

  const tagMap={
    sale:['tag-sale','특가'],
    package:['tag-package','패키지'],
    event:['tag-event','이벤트'],
    new:['tag-new','NEW']
  };
  let promoHtml='';
  w.hotels.forEach(h=>{
    let promoContent='';
    if(h.promos&&h.promos.length){
      h.promos.forEach((p,i)=>{
        const tags=p.tags.map(t=>`<span class="promo-tag ${tagMap[t][0]}">${tagMap[t][1]}</span>`).join('');
        promoContent+=`<div style="margin-bottom:${i<h.promos.length-1?'10px':'0'};${i<h.promos.length-1?'padding-bottom:10px;border-bottom:1px dashed var(--gray-100);':''}">
          <div>${tags}</div>
          <div class="promo-title">${p.title}</div>
          <div class="promo-desc">${p.desc}</div>
          ${p.period?`<div class="promo-period">📅 ${p.period}</div>`:''}
        </div>`;
      });
    }else{promoContent='<div class="no-promo">이번 주 신규 프로모션 없음</div>';}
    promoHtml+=`<div class="hotel-card">
      <div class="hotel-name">${h.name}<span class="hotel-name-badge">${h.badge}</span></div>
      ${promoContent}
    </div>`;
  });
  document.getElementById('promoSection').innerHTML=promoHtml;

  let priceHtml='';
  if(w.priceNa){
    priceHtml=w.prices.map(p=>`<tr><td data-label="호텔"><strong>${p.hotel}</strong></td><td colspan="3"><span class="price-na">조회 불가 — 과거 날짜 (체크인 기준일 경과)</span></td></tr>`).join('');
  }else{
    priceHtml=w.prices.map(p=>`<tr>
      <td data-label="호텔"><strong>${p.hotel}</strong></td>
      <td data-label="최저가 / 객실">${p.na?'<span class="price-na">조회 불가 (OTA 미등록)</span>':`<div class="price-amount">${p.amount}</div><div class="price-room">🛏️ ${p.room}</div>`}</td>
      <td class="price-source" data-label="채널">${p.na?'—':p.channel||p.source}</td>
    </tr>`).join('');
  }
  document.getElementById('priceTableBody').innerHTML=priceHtml;
  document.getElementById('otaNote').textContent=w.priceNote;

}

const MOBILE_LINK_URL = "https://ibis-incheon-report.netlify.app";

function copyMobileLink(){
  const toast = document.getElementById('copyToast');
  const label = document.getElementById('mobileShareLabel');
  const showToast = (ok) => {
    toast.textContent = ok ? "링크가 복사되었습니다 ✓" : "복사 실패 — 길게 눌러 직접 복사해주세요";
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(MOBILE_LINK_URL).then(() => showToast(true)).catch(() => fallbackCopy());
  } else {
    fallbackCopy();
  }
  function fallbackCopy(){
    try {
      const ta = document.createElement('textarea');
      ta.value = MOBILE_LINK_URL;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(ok);
    } catch (e) {
      showToast(false);
    }
  }
}
